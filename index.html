// ---------- ripartizione di un'uscita ----------
function mesiDa(anno,mese,n=18){const out=[];for(let i=0;i<n;i++){const mm=mese-1+i;out.push({anno:anno+Math.floor(mm/12),mese:mm%12+1})}return out}
const amKey=x=>x.anno+'-'+pad(x.mese);
const amLabel=x=>MESI[x.mese-1]+(x.anno!==S.anno?' '+x.anno:'');
function mesiTutti(c){const out=[];for(let a=c-1;a<=c+1;a++)for(let m=1;m<=12;m++)out.push({anno:a,mese:m});return out}
function ripEditor(box,{tot,start,init}){
  const centro=init&&init.centro||S.anno;let eqStart=null;
  let mode=init?init.mode:'no',n=init&&init.n||2;
  let rows=init&&init.rows?init.rows.map(r=>({am:r.am,v:r.v})):null;
  box.innerHTML=`<div class="seg" role="group" aria-label="Ripartizione"><button type="button" data-rip="no">Nessuna</button><button type="button" data-rip="eq">In parti uguali</button><button type="button" data-rip="cu">Personalizzata</button></div>
   <div class="rip-eq" style="margin-top:10px"><div class="two"><div class="field"><label for="rip-da">Dal mese</label><select id="rip-da"></select></div><div class="field"><label for="rip-n">Per quanti mesi</label><select id="rip-n">${Array.from({length:11},(_,i)=>`<option value="${i+2}" ${i+2===n?'selected':''}>${i+2} mesi</option>`).join('')}</select></div></div></div>
   <div class="rip-cu" style="margin-top:10px;display:flex;flex-direction:column;gap:8px"><div class="rip-rows" style="display:flex;flex-direction:column;gap:8px"></div><button type="button" class="link rip-add" style="align-self:flex-start">+ Aggiungi mese</button></div>
   <p class="note rip-note" style="margin-top:8px"></p>`;
  const $=q=>box.querySelector(q);
  const opts=sel=>mesiTutti(centro).map(x=>`<option value="${amKey(x)}" ${amKey(x)===sel?'selected':''}>${amLabel(x)}</option>`).join('');
  const ensureRows=()=>{if(rows&&rows.length)return;const m=mesiDa(start().anno,start().mese,2);rows=m.map(x=>({am:amKey(x),v:''}))};
  const drawRows=()=>{$('.rip-rows').innerHTML=rows.map((r,i)=>`<div style="display:grid;grid-template-columns:1.2fr 1fr 44px;gap:8px;align-items:center"><select data-i="${i}" class="rip-m" aria-label="Mese della quota ${i+1}" style="height:46px;font-size:16px">${opts(r.am)}</select><input data-i="${i}" class="rip-v num" inputmode="decimal" placeholder="0,00" aria-label="Importo della quota ${i+1}" value="${esc(r.v)}" style="height:46px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;min-width:0"><button type="button" class="ghost rip-del" data-i="${i}" aria-label="Togli la quota ${i+1}" ${rows.length<=1?'disabled':''}>${ICON.close}</button></div>`).join('');
    box.querySelectorAll('.rip-m').forEach(x=>x.onchange=()=>{rows[+x.dataset.i].am=x.value;note()});
    box.querySelectorAll('.rip-v').forEach(x=>x.oninput=()=>{rows[+x.dataset.i].v=x.value;note()});
    box.querySelectorAll('.rip-del').forEach(x=>x.onclick=()=>{rows.splice(+x.dataset.i,1);drawRows();note()})};
  const drawEq=()=>{const cur=eqStart||amKey(start());$('#rip-da').innerHTML=opts(cur)};
  const calc=()=>{const v=tot();
    if(mode==='no'){const s0=start();return {ok:true,list:[{anno:s0.anno,mese:s0.mese,importo:r2(v||0)}]}}
    if(mode==='eq'){const es=eqStart||amKey(start());const [ea,em]=es.split('-').map(Number);const m=mesiDa(ea,em,n);const q=r2(v/n);return {ok:v>0,err:'Scrivi l\'importo',list:m.map((x,i)=>({anno:x.anno,mese:x.mese,importo:i===n-1?r2(v-q*(n-1)):q}))}}
    const seen=new Set();const list=[];
    for(const r of rows){const a=num(r.v);if(r.v===''||isNaN(a))continue;if(seen.has(r.am))return {ok:false,err:'Ogni mese può comparire una volta sola'};seen.add(r.am);const [an,me]=r.am.split('-').map(Number);list.push({anno:an,mese:me,importo:r2(a)})}
    list.sort((a,b)=>a.anno-b.anno||a.mese-b.mese);
    const somma=r2(list.reduce((s,q)=>s+q.importo,0)),resto=r2((v||0)-somma);
    if(!(v>0))return {ok:false,err:'Scrivi l\'importo',list,resto};
    if(list.length<1)return {ok:false,err:'Inserisci almeno un mese con il suo importo',list,resto};
    if(Math.abs(resto)>0.004)return {ok:false,err:resto>0?`Mancano ${eur(resto)} da ripartire`:`Hai ripartito ${eur(-resto)} in più del totale`,list,resto};
    return {ok:true,list,resto:0}};
  const note=()=>{const R=calc(),el=$('.rip-note');
    if(mode==='no'){el.textContent='Conta tutta nel mese di addebito.';return}
    if(mode==='eq'){el.textContent=R.ok?R.list.map(q=>amLabel(q)+' '+eur(q.importo)).join(' · ')+'. Uscita reale una sola volta.':'Scrivi l\'importo per vedere le quote.';return}
    el.innerHTML=R.ok?'<span class="pos">Ripartito tutto.</span> '+(R.list.length>1?'Uscita reale una sola volta. ':'')+'Puoi scegliere anche mesi passati o dell\'anno prima.':esc(R.err)};
  const sync=()=>{box.querySelectorAll('[data-rip]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.rip===mode));
    $('.rip-eq').hidden=mode!=='eq';$('.rip-cu').hidden=mode!=='cu';if(mode==='cu'){ensureRows();drawRows()}if(mode==='eq')drawEq();note()};
  box.querySelectorAll('[data-rip]').forEach(b=>b.onclick=()=>{mode=b.dataset.rip;sync()});
  $('#rip-n').onchange=e=>{n=+e.target.value;note()};
  $('#rip-da').onchange=e=>{eqStart=e.target.value;note()};
  $('.rip-add').onclick=()=>{ensureRows();const used=new Set(rows.map(r=>r.am));const last=rows.length?rows[rows.length-1].am.split('-').map(Number):[start().anno,start().mese];const all=mesiTutti(centro);const nx=mesiDa(last[0],last[1],36).slice(1).find(x=>!used.has(amKey(x))&&all.some(y=>amKey(y)===amKey(x)))||all.find(x=>!used.has(amKey(x)));if(!nx){toast('Hai già usato tutti i mesi disponibili');return}rows.push({am:amKey(nx),v:''});drawRows();note()};
  sync();
  return {quote:calc,refresh:()=>{if(mode==='cu')drawRows();if(mode==='eq')drawEq();note()}};
}
// scrive le quote (sostituendo quelle di un gruppo esistente)
async function salvaQuote(base,totale,list,gruppoVecchio){
  const old=gruppoVecchio?S.D.movimenti.filter(x=>x.gruppo===gruppoVecchio):[];
  if(list.length===1){const q=list[0];const id=old[0]?old[0].id:newId();
    await put('movimenti/'+id,Object.assign({},base,{anno:q.anno,mese:q.mese,importo:r2(totale)}));
    for(const x of old.slice(1))await del('movimenti/'+x.id);return}
  const g=gruppoVecchio||newId();
  for(let i=0;i<list.length;i++){const q=list[i];const id=old[i]?old[i].id:newId();
    await put('movimenti/'+id,Object.assign({},base,{anno:q.anno,mese:q.mese,importo:q.importo,gruppo:g,quota:(i+1)+'/'+list.length,totale:r2(totale)}))}
  for(const x of old.slice(list.length))await del('movimenti/'+x.id);
}
function sheetGruppo(g){
  const qs=S.D.movimenti.filter(x=>x.gruppo===g).sort((a,b)=>a.anno-b.anno||a.mese-b.mese);if(!qs.length)return;
  const s=qs[0];const tot=+s.totale||r2(qs.reduce((a,x)=>a+(+x.importo),0));
  const start={anno:s.anno,mese:s.mese};
  openSheet('Modifica uscita ripartita',`<form id="f-g" novalidate style="display:flex;flex-direction:column;gap:14px">
   <div class="field"><label for="g-imp">Importo totale (€)</label><input id="g-imp" class="big num" inputmode="decimal" value="${inp(tot)}"></div>
   <div class="field"><label for="g-cat">Categoria</label><select id="g-cat">${catOptions(s.categoria)}</select></div>
   <div class="field"><label for="g-met">Metodo di pagamento</label><select id="g-met">${metOptions(s.metodo||'')}</select></div>
   <div class="field"><label for="g-desc">Descrizione</label><input id="g-desc" value="${esc(s.descrizione)}"></div>
   <div class="two"><div class="field"><label for="g-data">Data</label><input id="g-data" type="date" value="${esc(s.data||'')}"></div><div class="field"><label for="g-mese">Primo mese</label><select id="g-mese">${meseOptions(s.mese)}</select></div></div>
   <div class="field"><label>Ripartizione</label><div id="g-ripbox"></div></div>
   <div class="actions"><button class="pill-btn danger" type="button" id="g-del">Elimina</button><button class="pill-btn" type="submit">Salva</button></div></form>`,(el,close)=>{
    const $=q=>el.querySelector(q);const imp=$('#g-imp'),ms=$('#g-mese');
    const RE=ripEditor($('#g-ripbox'),{tot:()=>num(imp.value),start:()=>({anno:start.anno,mese:+ms.value}),init:{mode:'cu',centro:Math.round((qs[0].anno+qs[qs.length-1].anno)/2),rows:qs.map(x=>({am:amKey(x),v:inp(x.importo)}))}});
    imp.addEventListener('input',RE.refresh);ms.addEventListener('change',RE.refresh);
    $('#f-g').onsubmit=async e=>{e.preventDefault();const v=num(imp.value);if(!(v>0)){toast('Importo non valido');return}
      const R=RE.quote();if(!R.ok){toast(R.err);return}
      await salvaQuote({data:$('#g-data').value||null,tipo:'spesa',categoria:$('#g-cat').value,descrizione:$('#g-desc').value.trim(),metodo:$('#g-met').value||null},v,R.list,g);
      close();toast(`Aggiornato: ${eur(v)} · `+R.list.map(q=>MB[q.mese-1]+' '+n2(q.importo)).join(', '))};
    $('#g-del').onclick=async()=>{close();if(!await confirmBox('Elimina uscita ripartita',`Eliminare "${esc(s.descrizione)}" da ${eur(tot)} con tutte le sue ${qs.length} quote?`,'Elimina',true))return;for(const x of qs)await del('movimenti/'+x.id);toast('Uscita eliminata')};
  });
}

// ---------- swipe tra i mesi (segue il dito) ----------
(function(){
  const v=document.getElementById('view');let t=null;
  const calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ok=()=>['home','dashboard','registro','simula','dettaglio'].includes(S.view)&&!sheetClose&&S.ready;
  const reset=()=>{v.style.transition='';v.style.transform='';v.style.opacity=''};
  v.addEventListener('touchstart',e=>{t=null;if(e.touches.length!==1||!ok())return;if(e.target.closest('.chips,.table-box,input,select,textarea'))return;
    t={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now(),lock:null,dx:0}},{passive:true});
  v.addEventListener('touchmove',e=>{if(!t)return;const dx=e.touches[0].clientX-t.x,dy=e.touches[0].clientY-t.y;
    if(t.lock===null){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;t.lock=Math.abs(dx)>Math.abs(dy)*1.1?'x':'y'}
    if(t.lock!=='x')return;e.preventDefault();
    const edge=(S.mese===1&&dx>0)||(S.mese===12&&dx<0);t.edge=edge;t.dx=edge?dx*0.25:dx;
    v.style.transition='none';v.style.transform=`translateX(${t.dx}px)`;v.style.opacity=String(1-Math.min(.35,Math.abs(t.dx)/v.clientWidth*.6))},{passive:false});
  const end=()=>{if(!t)return;const s=t;t=null;if(s.lock!=='x')return;
    const w=v.clientWidth,vel=Math.abs(s.dx)/Math.max(1,Date.now()-s.t),go=!s.edge&&(Math.abs(s.dx)>w*0.18||vel>0.45&&Math.abs(s.dx)>30);
    if(!go){if(calm){reset();return}v.style.transition='transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s';v.style.transform='translateX(0)';v.style.opacity='1';setTimeout(reset,300);return}
    const d=s.dx<0?1:-1;
    if(calm){S.mese+=d;render();reset();return}
    v.style.transition='transform .16s ease-in,opacity .16s';v.style.transform=`translateX(${-d*w*0.6}px)`;v.style.opacity='0';
    setTimeout(()=>{S.mese+=d;render();v.style.transition='none';v.style.transform=`translateX(${d*w*0.35}px)`;v.style.opacity='0';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{v.style.transition='transform .26s cubic-bezier(.2,.8,.2,1),opacity .22s';v.style.transform='translateX(0)';v.style.opacity='1';setTimeout(reset,300)}))},160)};
  v.addEventListener('touchend',end,{passive:true});v.addEventListener('touchcancel',()=>{t=null;reset()},{passive:true});
})();

const DEFAULT_URL='https://script.google.com/macros/s/AKfycbzmAef7RJdhtM9Dn0NoSxx6912wUaCX35xGAJ1U8Yl8ChiYU-QmF8G0JEFm39SzCC0_/exec';
// ---------- dati: Google Sheet tramite Apps Script, con copia locale e coda offline ----------
const LS={api:'budget-api',cache:'budget-cache',queue:'budget-queue'};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const SYNC={api:lsGet(LS.api,null),raw:lsGet(LS.cache,null),queue:lsGet(LS.queue,[]),busy:false,last:null,err:null,online:navigator.onLine};
const MB_=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const nz=v=>v===null||v===undefined||v===''?null:Number(v);
const st=v=>v===null||v===undefined?'':String(v);

function rawToD(raw){
  raw=raw||{};
  const categorie=(raw.categorie||[]).filter(c=>c.id).map(c=>({id:st(c.id),nome:st(c.nome),tipo:st(c.tipo)||'variabile',ordine:nz(c.ordine)||0,dal:nz(c.dal),al:nz(c.al)}));
  const metodi=(raw.metodi||[]).map(m=>st(m.nome)).filter(Boolean);
  const riporti={};(raw.riporti||[]).forEach(r=>{if(r.anno!=null)riporti[String(nz(r.anno))]=nz(r.importo)||0});
  const movimenti=(raw.movimenti||[]).filter(x=>x.id).map(x=>{const o={id:st(x.id),anno:nz(x.anno),mese:nz(x.mese),data:x.data?st(x.data):null,tipo:st(x.tipo),categoria:x.categoria?st(x.categoria):null,descrizione:st(x.descrizione),importo:nz(x.importo)||0,metodo:x.metodo?st(x.metodo):null};
    if(x.gruppo){o.gruppo=st(x.gruppo);o.quota=st(x.quota);o.totale=nz(x.totale)}return o});
  const previsioni=(raw.previsioni||[]).filter(x=>x.id).map(x=>{const eff={};MB_.forEach((m,i)=>{const v=nz(x['Eff '+m]);if(v!=null)eff[String(i+1)]=v});
    return {id:st(x.id),scadenza:x.scadenza===true||String(x.scadenza).toUpperCase()==='TRUE',anno:nz(x.anno),categoria:st(x.categoria),descrizione:st(x.descrizione),tipo:st(x.tipo)||'certo',giorno:nz(x.giorno),metodo:x.metodo?st(x.metodo):null,importi:MB_.map(m=>nz(x[m])),effettivi:eff}});
  const stipendi=(raw.stipendi||[]).filter(x=>x.id).map(x=>({id:st(x.id),anno:nz(x.anno),mese:nz(x.mese),netto:nz(x.netto),lordo:nz(x.lordo),stato:st(x.stato)||'confermato'}));
  return {config:{nome:'Michele Parente',categorie,metodi,riporti},movimenti,previsioni,stipendi};
}
function prevToRow(d){const r={anno:d.anno,categoria:d.categoria,descrizione:d.descrizione,tipo:d.tipo,giorno:d.giorno??null,metodo:d.metodo??null,scadenza:!!d.scadenza};
  MB_.forEach((m,i)=>{r[m]=d.importi?d.importi[i]:null;const e=d.effettivi&&d.effettivi[String(i+1)];r['Eff '+m]=e==null?null:e});return r}
function movToRow(d){return {anno:d.anno,mese:d.mese,data:d.data||null,tipo:d.tipo,categoria:d.categoria||null,descrizione:d.descrizione||'',importo:d.importo,metodo:d.metodo||null,gruppo:d.gruppo||null,quota:d.quota||null,totale:d.totale??null}}
function configOps(c){return [
  {op:'replace',col:'categorie',rows:(c.categorie||[]).map(x=>({id:x.id,nome:x.nome,tipo:x.tipo,ordine:x.ordine,dal:x.dal??null,al:x.al??null}))},
  {op:'replace',col:'metodi',rows:(c.metodi&&c.metodi.length?c.metodi:METODI_DEF).map(n=>({nome:n}))},
  {op:'replace',col:'riporti',rows:Object.entries(c.riporti||{}).map(([a,v])=>({anno:+a,importo:v}))}]}

// applica le operazioni alla copia locale (subito, anche offline)
function applyLocal(raw,ops){
  raw=JSON.parse(JSON.stringify(raw||{movimenti:[],previsioni:[],stipendi:[],categorie:[],metodi:[],riporti:[]}));
  ops.forEach(o=>{raw[o.col]=raw[o.col]||[];
    if(o.op==='replace'){raw[o.col]=o.rows.slice();return}
    const i=raw[o.col].findIndex(r=>String(r.id)===String(o.id));
    if(o.op==='delete'){if(i>=0)raw[o.col].splice(i,1);return}
    const row=Object.assign({},o.data,{id:o.id});if(i>=0)raw[o.col][i]=row;else raw[o.col].push(row)});
  return raw;
}
function publish(){S.D=rawToD(SYNC.raw);S.ready=true;schedule()}
async function enqueue(ops){
  SYNC.raw=applyLocal(SYNC.raw,ops);lsSet(LS.cache,SYNC.raw);
  SYNC.queue=SYNC.queue.concat(ops);lsSet(LS.queue,SYNC.queue);
  publish();flush();
}
async function call(method,body){
  const u=SYNC.api.url;
  const r=method==='GET'?await fetch(u+(u.includes('?')?'&':'?')+'key='+encodeURIComponent(SYNC.api.key)+'&t='+Date.now(),{redirect:'follow'})
    :await fetch(u,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:SYNC.api.key},body))});
  if(!r.ok)throw new Error('http '+r.status);
  const j=await r.json();if(!j.ok)throw new Error(j.error||'errore');return j;
}
async function flush(){
  if(!SYNC.api)return;
  if(SYNC.busy)return new Promise(r=>setTimeout(()=>r(flush()),400));
  SYNC.busy=true;
  try{
    if(SYNC.queue.length){const sent=SYNC.queue.slice();const j=await call('POST',{ops:sent});
      SYNC.queue=SYNC.queue.slice(sent.length);lsSet(LS.queue,SYNC.queue);
      SYNC.raw=applyLocal(j.data,SYNC.queue);}
    else{const j=await call('GET');SYNC.raw=applyLocal(j.data,SYNC.queue)}
    lsSet(LS.cache,SYNC.raw);SYNC.last=new Date();SYNC.err=null;publish();
  }catch(e){SYNC.err=String(e.message||e);schedule()}
  finally{SYNC.busy=false;if(SYNC.queue.length&&!SYNC.err)setTimeout(flush,300)}
}
// API usata dall'app (stessa forma di prima)
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
async function put(path,data){
  const [col,id]=path.split('/');
  if(col==='config'){await enqueue(configOps(data));return}
  const row=col==='previsioni'?prevToRow(data):col==='movimenti'?movToRow(data):data;
  await enqueue([{op:'set',col,id,data:row}]);
  if(!navigator.onLine)toast('Salvato sul telefono: lo invio appena torni online');
}
async function del(path){const [col,id]=path.split('/');await enqueue([{op:'delete',col,id}])}
async function saveConfig(c){await put('config/main',c)}
let started=false;
function start(){
  if(SYNC.raw)publish();
  if(!started){started=true;splashStart()}
  if(!SYNC.api){S.ready=true;S.view='collega';schedule();splashEnd();return}
  flush().then(()=>splashEnd(SYNC.err?(SYNC.raw?'Non riesco a sincronizzare: ti mostro i dati salvati sul telefono':'Non riesco a raggiungere i dati'):null));
  setInterval(()=>{if(document.visibilityState==='visible')flush()},60000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')flush()});
  window.addEventListener('online',()=>{SYNC.online=true;flush();schedule()});
  window.addEventListener('offline',()=>{SYNC.online=false;schedule()});
}
async function collega(url,key){
  SYNC.api={url:url.trim(),key:key.trim()};
  try{const j=await call('GET');lsSet(LS.api,SYNC.api);SYNC.raw=applyLocal(j.data,SYNC.queue);lsSet(LS.cache,SYNC.raw);SYNC.last=new Date();SYNC.err=null;publish();setInterval(()=>{if(document.visibilityState==='visible')flush()},60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')flush()});checkRiporto();return true}
  catch(e){SYNC.api=lsGet(LS.api,null);throw e}
}
function syncLine(){
  if(!SYNC.api)return 'Non collegato';
  const q=SYNC.queue.length;
  if(!navigator.onLine)return `Offline · ${q?q+' modifiche da inviare':'dati salvati sul telefono'}`;
  if(SYNC.err)return `Sincronizzazione non riuscita (${SYNC.err}) · ${q} in attesa`;
  if(SYNC.busy||q)return 'Sincronizzo…';
  return SYNC.last?'Sincronizzato alle '+SYNC.last.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'Collegato';
}

// ---------- schermata di avvio ----------
const SPL={t0:Date.now(),done:false,timer:null};
function splashStep(pct,msg){const f=document.getElementById('splash-fill'),m=document.getElementById('splash-msg');if(f)f.style.width=pct+'%';if(m&&msg)m.textContent=msg}
function splashStart(){
  splashStep(15,SYNC.api?'Collego i tuoi dati…':'Avvio…');
  let p=15;SPL.timer=setInterval(()=>{p=Math.min(88,p+(88-p)*0.12);splashStep(p)},250);
  setTimeout(()=>{if(!SPL.done&&SYNC.raw)splashEnd(navigator.onLine?'Rete lenta: ti mostro i dati salvati sul telefono':'Offline: ti mostro i dati salvati sul telefono')},9000);
  setTimeout(()=>{if(!SPL.done)splashEnd()},15000);
}
function splashEnd(msg){
  if(SPL.done)return;SPL.done=true;clearInterval(SPL.timer);
  splashStep(100,msg||'Pronto');
  const wait=Math.max(0,1800-(Date.now()-SPL.t0));
  setTimeout(()=>{const el=document.getElementById('splash');if(!el)return;el.classList.add('out');setTimeout(()=>el.remove(),400);checkRiporto()},wait+(msg?900:250));
}
// ---------- riporto: proposta al primo accesso del nuovo anno ----------
function checkRiporto(){
  if(!SYNC.api||SYNC.err||!S.ready)return;
  const Yr=today().getFullYear(),key='budget-riporto-'+Yr;
  if(lsGet(key,null))return;
  const prev=Yr-1;
  const hasPrev=S.D.movimenti.some(x=>x.anno===prev)||S.D.previsioni.some(x=>x.anno===prev)||S.D.stipendi.some(x=>x.anno===prev);
  if(!hasPrev)return;
  const av=computeYear(S.D,prev,today()).mesi[11].avanzo;
  const cur=(cfg().riporti||{})[String(Yr)];
  if(cur!=null&&Math.abs(cur-av)<0.005){lsSet(key,'ok');return}
  openSheet('Riporto '+Yr,`<p style="margin:0">Il ${prev} si è chiuso con un avanzo di <strong class="num">${sgn(av)}</strong>.</p><p class="note">Riporto di Gennaio ${Yr} oggi: <strong class="num">${cur==null?'non impostato':eur(cur)}</strong>. Lo aggiorno con l'avanzo reale di Dicembre ${prev}?</p><div class="actions"><button class="pill-btn soft" data-r="no">Lascia così</button><button class="pill-btn" data-r="si">Aggiorna</button></div>`,(el,close)=>{
    el.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{lsSet(key,b.dataset.r);close();
      if(b.dataset.r==='si'){const c=JSON.parse(JSON.stringify(cfg()));c.riporti=c.riporti||{};c.riporti[String(Yr)]=r2(av);await saveConfig(c);toast('Riporto '+Yr+': '+eur(av))}});
  },{compact:true});
}

// ---------- aggiornamenti dell'app ----------
if('serviceWorker' in navigator&&location.protocol==='https:'){
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    const chk=()=>reg.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk()});
    setInterval(chk,30*60*1000);
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!reloaded&&!document.querySelector('.sheet')){reloaded=true;location.reload()}});
}

route();start();
