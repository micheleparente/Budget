<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#F3F4F7">
<meta name="robots" content="noindex, nofollow">
<title>Budget Michele</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Fintech pulito: neutri leggermente freddi, un solo accento blu, numeri tabellari. Layout: colonna unica da telefono, card a sezioni, barra schede in basso. */
  --bg:#F3F4F7; --card:#FFFFFF; --ink:#0D0F14; --sub:#5A5F6B; --line:#E4E6EB; --soft:#EEF0F4;
  --accent:#2F5BFF; --accent-ink:#1D47E6; --on-accent:#FFFFFF; --chip:#E8EDFF;
  --pos:#0A7A4E; --neg:#C2410C; --warn-bg:#FFF3E2; --warn-ink:#8A4B08;
  --fixed:#2F5BFF; --var:#F59E0B;
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --r-lg:24px; --r-md:16px; --r-sm:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-mode="light"]){
    --bg:#0A0B0F; --card:#16181F; --ink:#F3F4F6; --sub:#A3A8B4; --line:#272B34; --soft:#1D2028;
    --accent:#4D74FF; --accent-ink:#93ABFF; --on-accent:#FFFFFF; --chip:#1E2542;
    --pos:#3DD68C; --neg:#FF8A4C; --warn-bg:#2B2012; --warn-ink:#FFC27A;
    --fixed:#93ABFF; --var:#FFB454; color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]), :root[data-mode="dark"]{
  --bg:#0A0B0F; --card:#16181F; --ink:#F3F4F6; --sub:#A3A8B4; --line:#272B34; --soft:#1D2028;
  --accent:#4D74FF; --accent-ink:#93ABFF; --on-accent:#FFFFFF; --chip:#1E2542;
  --pos:#3DD68C; --neg:#FF8A4C; --warn-bg:#2B2012; --warn-ink:#FFC27A;
  --fixed:#93ABFF; --var:#FFB454; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num,td,.amt{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
#view{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 112px);display:flex;flex-direction:column;gap:16px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-size:13px;color:var(--sub);margin:0;font-weight:500}
.monthnav{display:flex;align-items:center;gap:2px;margin-left:-10px}
.monthnav h1{font-size:26px;font-weight:800;letter-spacing:-.5px;min-width:0}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ghost{width:36px;height:44px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ghost:disabled{opacity:.3}
.pill-btn{height:44px;padding:0 18px;border-radius:22px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.pill-btn.soft{background:var(--chip);color:var(--accent-ink)}
.pill-btn.danger{background:transparent;color:var(--neg);border:1px solid var(--line)}
.card{background:var(--card);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:14px}
.card.tight{padding:6px 20px}
.card h2{font-size:17px;font-weight:700}
.row-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{background:none;border:0;color:var(--accent-ink);font-weight:700;font-size:14px;padding:10px 0;min-height:44px}
.muted{color:var(--sub)}
.small{font-size:13px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
/* anello */
.ring-wrap{position:relative;width:208px;height:208px;margin:0 auto}
.ring-wrap svg{display:block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.ring-center .big{font-size:32px;font-weight:800;letter-spacing:-1px}
.ring-center .lbl{font-size:13px;color:var(--sub)}
.rate-line{margin:-4px 0 0;text-align:center;font-size:15px;font-weight:700;color:var(--accent-ink)}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:3px;background:var(--soft)}
.split span{display:block;height:100%}
.legend{display:flex;justify-content:space-between;font-size:13px;gap:8px;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px;vertical-align:middle}
/* segmenti */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--soft);padding:4px;border-radius:14px}
.seg button{height:38px;border:0;border-radius:10px;background:transparent;color:var(--sub);font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--soft);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile.hero{background:var(--accent);color:var(--on-accent)}
.tile .t-l{font-size:12px;font-weight:600;opacity:.85}
.tile .t-v{font-size:21px;font-weight:800;letter-spacing:-.4px;overflow-wrap:anywhere}
.tile .t-n{font-size:12px;opacity:.85}
.netrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:4px;border-top:1px solid var(--line);padding-top:14px}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:11px;font-weight:800;letter-spacing:.3px;background:var(--soft);color:var(--sub)}
.chip.ok{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.chip.sim{background:var(--soft);color:var(--sub)}
.chip.acc{background:var(--chip);color:var(--accent-ink)}
/* liste */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;min-height:56px}
.list > .item:first-child{border-top:0}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.item .s{font-size:12px;color:var(--sub);overflow-wrap:anywhere}
.item .amt{font-weight:700;font-size:15px;text-align:right;white-space:nowrap}
.badge{width:40px;height:40px;border-radius:12px;background:var(--chip);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.bar{position:relative;height:8px;border-radius:4px;background:var(--soft);margin-top:6px}
.bar i{display:block;height:8px;border-radius:4px}
.bar b{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);border-radius:1px}
.catrow{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.catrow:first-of-type{border-top:0}
.catrow .l1{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:600}
.catrow .l2{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--sub)}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r-md);padding:12px 16px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;text-align:left;width:100%;min-height:44px}
.banner strong{font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--sub)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sum-line{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.sum-line strong{font-weight:800}
.sec-title{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin:4px 4px -6px}
/* tabelle */
.table-box{overflow-x:auto;border-radius:var(--r-md);background:var(--card);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:13px;min-width:100%}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:700;color:var(--sub);font-size:12px;position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;max-width:150px;white-space:normal}
td.fut{color:var(--sub);font-style:italic}
td.diff{background:var(--warn-bg);color:var(--warn-ink);font-weight:700}
tr.tot td{font-weight:800}
tr.tot:first-of-type td{border-top:2px solid var(--line)}
tr.click{cursor:pointer}
/* menu */
.menu .item .chev{color:var(--sub)}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--sub);text-decoration:none;min-height:50px;justify-content:center}
.tabs a[aria-current="page"]{color:var(--accent-ink)}
.tabs .fab{width:56px;height:56px;border-radius:28px;background:var(--accent);color:var(--on-accent);border:0;justify-self:center;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent);margin-top:-18px}
/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(5,6,10,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.backdrop[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overscroll-behavior:contain;overflow-y:auto;border-radius:24px 24px 0 0;padding:12px 16px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet-hd h2{font-size:20px;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--sub)}
.field input,.field select{height:50px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:17px;width:100%;min-width:0}
.field input.big{height:68px;font-size:34px;font-weight:800;letter-spacing:-.5px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid12{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid12 .field input{height:44px;font-size:15px;padding:0 10px}
.catpick{display:flex;flex-wrap:wrap;gap:8px}
.catpick button{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600}
.catpick button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .pill-btn{flex:1;justify-content:center;height:52px;font-size:16px}
.note{font-size:13px;color:var(--sub);margin:0}

.empty{padding:28px 8px;text-align:center;color:var(--sub);font-size:15px}
.cmp{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;font-size:14px;align-items:center}
.cmp .h{font-size:12px;color:var(--sub);font-weight:700}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.item .s .chip{height:18px;font-size:10px;padding:0 6px;margin-left:4px;vertical-align:1px}
.item.is-prev .t,.item.is-prev .amt{color:var(--sub)}
.item.is-prev .badge{background:transparent;border:1.5px dashed var(--line);color:var(--sub)}
.badge.in{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.field select#reg-cat{height:44px;font-size:15px}
[hidden]{display:none!important}

/* schermata di avvio */
.splash{position:fixed;inset:0;z-index:100;background:#1F4BF5;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;transition:opacity .45s ease,transform .45s ease;overflow:hidden}
:root[data-mode="dark"] .splash{background:#1336C9}
.splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.splash .halo{position:absolute;width:520px;height:520px;border-radius:50%;border:1.5px solid rgba(255,255,255,.10);top:50%;left:50%;transform:translate(-50%,-50%)}
.splash .halo.h2{width:340px;height:340px;border-color:rgba(255,255,255,.14)}
.splash .ring{width:76px;height:76px;margin-bottom:22px}
.splash .ring circle.arc{stroke-dasharray:75 100;stroke-dashoffset:75;animation:draw 1s .1s cubic-bezier(.6,0,.2,1) forwards}
.splash .ring circle.dot{opacity:0;transform-origin:38px 38px;animation:pop .4s .9s ease-out forwards}
.splash .word{display:flex;font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.splash .word span{display:inline-block;opacity:0;transform:translateY(22px);animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards}
.splash .tag{margin:12px 0 0;font-size:15px;font-weight:500;opacity:0;animation:fade .6s 1.15s forwards;color:rgba(255,255,255,.82)}
.splash .bottom{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 56px);display:flex;flex-direction:column;align-items:center;gap:12px}
.splash .track{width:min(200px,60vw);height:4px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.splash .fill{height:100%;width:0;border-radius:2px;background:#fff;transition:width .4s ease}
.splash p#splash-msg{margin:0;font-size:13px;color:rgba(255,255,255,.78);min-height:18px;text-align:center;max-width:300px}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.splash,.splash .fill{transition:none}.splash .word span,.splash .tag,.splash .ring circle.dot{animation:none;opacity:1;transform:none}.splash .ring circle.arc{animation:none;stroke-dashoffset:0}}

/* altezza fissa dei fogli: non saltano quando cambia il contenuto */
.sheet.tall{height:88vh;height:88dvh;max-height:88dvh}
.sheet.compact{max-height:70dvh}

/* avviso in alto */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-16px);opacity:0;z-index:120;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);padding:10px 16px 10px 10px;border-radius:18px;background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);color:var(--ink);font-size:14px;font-weight:600;line-height:1.3;box-shadow:0 10px 30px rgba(0,0,0,.16),0 0 0 1px var(--line);transition:transform .32s cubic-bezier(.2,.9,.2,1.15),opacity .25s ease;cursor:pointer}
.toast.in{transform:translate(-50%,0);opacity:1}
.toast[hidden]{display:none}
.toast .t-ic{flex:none;width:26px;height:26px;border-radius:13px;background:var(--pos);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.toast.warn .t-ic{background:#E8890C}
@media (prefers-reduced-motion: reduce){.toast{transition:opacity .2s}}
/* badge da confermare */
.dc-badge{height:32px;padding:0 12px;border-radius:16px;border:0;background:var(--warn-bg);color:var(--warn-ink);font-size:12px;font-weight:800;white-space:nowrap}
/* Home a pagina unica */
#view.fit{height:100vh;height:100dvh;overflow:hidden;padding-bottom:calc(env(safe-area-inset-bottom) + 96px);gap:12px;overscroll-behavior:none}
#view.fit .card{flex:none}
#view.fit .ring-card{flex:1 1 auto;min-height:0;justify-content:center;gap:8px;padding:16px 20px}
#view.fit .pano-card{gap:10px;padding:14px 16px}
#view.fit .tile{padding:11px 12px;gap:3px}
#view.fit .tile .t-v{font-size:19px}
#view.fit .netrow{padding-top:10px}
.ring-wrap{width:var(--ring,208px);height:var(--ring,208px)}
.ring-wrap svg{width:100%;height:100%}
#view.fit{--ring:clamp(120px,calc(100dvh - 590px),200px)}
#view.fit .ring-center .big{font-size:clamp(22px,4.2dvh,32px)}
#view{touch-action:pan-y}
#view.fit .ring-card{overflow:hidden}
@media (max-height:740px){
  #view.fit{--ring:clamp(88px,calc(100dvh - 560px),170px);gap:10px}
  #view.fit .ring-card .note,#view.fit .tile .t-n{display:none}
  #view.fit .ring-card{padding:12px 16px;gap:4px}
  #view.fit .hd .eyebrow{display:none}
  #view.fit .seg button{height:34px}
}
#view.fit .ring-center .big{font-size:calc(var(--ring) * .15);letter-spacing:-.5px}
#view.fit .ring-center .lbl{font-size:max(11px,calc(var(--ring) * .065))}
.switch{width:100%;display:flex;align-items:center;gap:12px;justify-content:space-between;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;min-height:56px}
.switch .sw-t{display:flex;flex-direction:column;gap:2px;font-size:15px}
.switch .sw-k{flex:none;width:50px;height:30px;border-radius:15px;background:var(--soft);position:relative;transition:background .2s}
.switch .sw-k::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"] .sw-k{background:var(--pos)}
.switch[aria-checked="true"] .sw-k::after{transform:translateX(20px)}
.badge{line-height:1.05;text-align:center}
.simtag{display:block;font-size:11px;font-weight:600;color:var(--sub);margin-top:1px}
.tile.hero .simtag{color:inherit;opacity:.8}

</style>
</head>
<body>
<div class="splash" id="splash" role="status" aria-live="polite" aria-label="Caricamento"><div class="halo" aria-hidden="true"></div><div class="halo h2" aria-hidden="true"></div><svg class="ring" viewBox="0 0 76 76" fill="none" aria-hidden="true"><circle cx="38" cy="38" r="24" stroke="rgba(255,255,255,.25)" stroke-width="7"/><circle class="arc" cx="38" cy="38" r="24" stroke="#fff" stroke-width="7" stroke-linecap="round" transform="rotate(-90 38 38)" pathLength="100"/><circle class="dot" cx="38" cy="38" r="5" fill="#fff"/></svg><div class="word" aria-hidden="true"><span style="animation-delay:0.35s">B</span><span style="animation-delay:0.42s">u</span><span style="animation-delay:0.49s">d</span><span style="animation-delay:0.56s">g</span><span style="animation-delay:0.63s">e</span><span style="animation-delay:0.70s">t</span></div><p class="tag">I tuoi flussi di cassa</p><div class="bottom"><div class="track" aria-hidden="true"><div class="fill" id="splash-fill"></div></div><p id="splash-msg">Avvio…</p></div></div>

<script>
// Motore di calcolo: movimenti (uscite/entrate), previsioni (certo/variabile/budget), stipendi.
function r2(x){return Math.round((x+Number.EPSILON)*100)/100}
function dayStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function monthState(anno,m,oggi){const y=oggi.getFullYear(),mm=oggi.getMonth()+1;if(anno<y||(anno===y&&m<mm))return 'chiuso';if(anno===y&&m===mm)return 'corrente';return 'futuro'}
function dataAddebito(anno,m,g){const dim=new Date(anno,m,0).getDate();return new Date(anno,m-1,Math.min(Math.max(1,g||1),dim))}
// Istanze mensili delle previsioni non-budget, con stato
function istanze(D,anno,oggi){
  const out=[];const t=dayStart(oggi);
  (D.previsioni||[]).filter(p=>p.anno===anno&&p.tipo!=='budget').forEach(p=>{
    for(let m=1;m<=12;m++){
      const v=p.importi&&p.importi[m-1];if(v==null)continue;
      const eff=p.effettivi&&p.effettivi[String(m)];
      const scaduta=p.giorno?dataAddebito(anno,m,p.giorno)<=t:monthState(anno,m,oggi)==='chiuso';
      let stato,importo=+v,auto=false;
      if(eff!=null){stato='effettivo';importo=+eff}
      else if(p.tipo==='certo'&&scaduta){stato='effettivo';auto=true}
      else if(p.tipo==='variabile'&&scaduta){stato='daconfermare'}
      else stato='previsto';
      out.push({p,m,stato,importo:r2(importo),previsto:+v,auto});
    }
  });
  return out;
}
// Netti 1..12, 13 (13ª, Dicembre), 14 (14ª, Luglio): reali o simulati dall'anno precedente
function nettiAnno(D,anno){
  const res={};
  for(let m=1;m<=14;m++){
    const s=(D.stipendi||[]).find(x=>x.anno===anno&&x.mese===m);
    if(s){res[m]={netto:+s.netto,lordo:s.lordo==null?null:+s.lordo,stato:s.stato||'confermato',doc:s};continue}
    const p=(D.stipendi||[]).find(x=>x.anno===anno-1&&x.mese===m);
    if(p)res[m]={netto:+p.netto,lordo:p.lordo==null?null:+p.lordo,stato:'simulato',doc:null};
  }
  return res;
}
function computeYear(D,anno,oggi){
  const cats=((D.config&&D.config.categorie)||[]).slice().sort((a,b)=>a.ordine-b.ordine);
  const mov=(D.movimenti||[]).filter(x=>x.anno===anno);
  const ist=istanze(D,anno,oggi);
  const bud=(D.previsioni||[]).filter(p=>p.anno===anno&&p.tipo==='budget');
  const N=nettiAnno(D,anno);
  const totNetti=Object.values(N).reduce((a,n)=>a+(+n.netto||0),0);
  const std=r2(totNetti/12);
  const riporto=+(((D.config&&D.config.riporti)||{})[String(anno)]||0);
  const cat={};
  const mk=(id,c)=>cat[id]||(cat[id]={id,nome:c?c.nome:id,tipo:c?c.tipo:'variabile',mesi:Array(12).fill(0),reale:Array(12).fill(0)});
  cats.forEach(c=>mk(c.id,c));
  for(let m=1;m<=12;m++){
    const closed=monthState(anno,m,oggi)==='chiuso';
    const real={},fixed={},b={};
    mov.filter(x=>x.mese===m).forEach(x=>{
      if(x.tipo==='spesa')real[x.categoria]=(real[x.categoria]||0)+(+x.importo);
      else if(x.tipo==='reso')real[x.categoria]=(real[x.categoria]||0)-(+x.importo);
    });
    ist.filter(i=>i.m===m).forEach(i=>{fixed[i.p.categoria]=(fixed[i.p.categoria]||0)+i.importo});
    bud.forEach(p=>{const v=p.importi&&p.importi[m-1];if(v!=null)b[p.categoria]=(b[p.categoria]||0)+(+v)});
    new Set([...Object.keys(real),...Object.keys(fixed),...Object.keys(b)]).forEach(id=>{
      const c=mk(id,cats.find(x=>x.id===id));const rl=real[id]||0,f=fixed[id]||0,bb=b[id]||0;
      c.reale[m-1]=r2(rl);
      c.mesi[m-1]=r2(f+(bb>0&&!closed?Math.max(bb,rl):rl));
    });
  }
  const mesi=[];let cum=0;
  for(let m=1;m<=12;m++){
    const spot=r2(mov.filter(x=>x.mese===m&&x.tipo==='spot').reduce((a,x)=>a+(+x.importo),0));
    const disp=r2(std+spot+(m===1?riporto:0));
    const all=Object.values(cat);
    const tot=r2(all.reduce((a,c)=>a+c.mesi[m-1],0));
    const fisse=r2(all.filter(c=>c.tipo==='fissa').reduce((a,c)=>a+c.mesi[m-1],0));
    const saldo=r2(disp-tot);cum=r2(cum+saldo);
    mesi.push({m,spot,disp,spese:tot,fisse,variabili:r2(tot-fisse),saldo,avanzo:cum,stato:monthState(anno,m,oggi),daconf:ist.filter(i=>i.m===m&&i.stato==='daconfermare').length});
  }
  return {anno,std,riporto,netti:N,totNetti:r2(totNetti),cat:Object.values(cat),mesi,ist};
}

// Esportazione Excel: fogli Spese (prospetto), Registro, Stipendi. Usa ExcelJS.
function buildWorkbook(ExcelJS,D,anno,oggi,nome){
  const MES=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const MBr=['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
  const y=computeYear(D,anno,oggi);
  const cats=((D.config&&D.config.categorie)||[]).slice().sort((a,b)=>a.ordine-b.ordine).filter(c=>((!c.dal||anno>=c.dal)&&(!c.al||anno<=c.al))||(D.movimenti||[]).some(x=>x.anno===anno&&x.categoria===c.id)||(D.previsioni||[]).some(p=>p.anno===anno&&p.categoria===c.id));
  const wb=new ExcelJS.Workbook();wb.creator='Budget Michele';wb.created=oggi;
  const EUR='#,##0.00 "€";[Red]-#,##0.00 "€"';
  const INK='FF0D0F14',ACC='FF2F5BFF',SOFT='FFEEF0F4',LINE='FFE4E6EB',SUB='FF5A5F6B';
  const FILL={fissa:'FFFDE8E8',variabile:'FFFFF3E2',investimento:'FFE6F4EC',simulazione:'FFE6F1FB'};
  const font=(o={})=>Object.assign({name:'Calibri',size:11,color:{argb:INK}},o);
  const fill=c=>({type:'pattern',pattern:'solid',fgColor:{argb:c}});
  const thin={style:'thin',color:{argb:LINE}};
  const col=n=>{let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
  const head=(row,bg=ACC)=>{row.eachCell(c=>{c.font=font({bold:true,color:{argb:'FFFFFFFF'}});c.fill=fill(bg);c.alignment={vertical:'middle',horizontal:c.col===1?'left':'center'}});row.height=22};
  const futuro=m=>monthState(anno,m,oggi)==='futuro';

  // ---------- SPESE ----------
  const ws=wb.addWorksheet('Spese',{views:[{state:'frozen',xSplit:1,ySplit:4}],properties:{tabColor:{argb:ACC}}});
  ws.columns=[{width:28},...MBr.map(()=>({width:12})),{width:15},{width:13}];
  ws.mergeCells('A1:O1');ws.getCell('A1').value=(nome||'Budget')+' · '+anno;ws.getCell('A1').font=font({size:16,bold:true});
  ws.getCell('A2').value=`Esportato il ${oggi.toLocaleDateString('it-IT')} · stipendio standard ${y.std.toLocaleString('it-IT',{minimumFractionDigits:2})} € · in corsivo grigio i mesi futuri (previsione)`;ws.getCell('A2').font=font({size:10,italic:true,color:{argb:SUB}});
  const hdr=r=>{const row=ws.getRow(r);row.values=[r===4?'ENTRATE':'SPESE',...MBr,'TOTALE ANNO','MEDIA'];head(row,r===4?'FF0A7A4E':ACC)};
  hdr(4);
  const put=(r,label,vals,opt={})=>{const row=ws.getRow(r);row.getCell(1).value=label;vals.forEach((v,i)=>{const c=row.getCell(i+2);c.value=v;c.numFmt=EUR;if(futuro(i+1))c.font=font({italic:true,color:{argb:SUB}})});
    row.getCell(14).value={formula:`SUM(B${r}:M${r})`};row.getCell(14).numFmt=EUR;row.getCell(14).font=font({bold:true});
    if(opt.media!==false){row.getCell(15).value={formula:`AVERAGE(B${r}:M${r})`};row.getCell(15).numFmt=EUR}
    if(opt.fill)row.eachCell({includeEmpty:true},c=>{if(c.col<=15)c.fill=fill(opt.fill)});
    row.eachCell({includeEmpty:true},c=>{if(c.col<=15)c.border={bottom:thin}});return row};
  put(5,'Stipendio standard',y.mesi.map(()=>y.std));
  put(6,'Entrate spot',y.mesi.map(m=>m.spot));
  put(7,'Riporto anno precedente',y.mesi.map((m,i)=>i===0?y.riporto:0),{media:false});
  const te=put(8,'TOTALE ENTRATE',[...Array(12)].map(()=>0),{fill:SOFT,media:false});
  for(let i=0;i<12;i++){const L=col(i+2);te.getCell(i+2).value={formula:`SUM(${L}5:${L}7)`};te.getCell(i+2).font=font({bold:true})}
  te.getCell(1).font=font({bold:true});
  const r0=10;hdr(r0);
  let r=r0+1;const first=r;
  cats.forEach(c=>{const cc=y.cat.find(x=>x.id===c.id);put(r,c.nome,cc?cc.mesi:Array(12).fill(0),{fill:FILL[c.tipo]});r++});
  const last=r-1;
  const ts=put(r,'TOTALE SPESE',[...Array(12)].map(()=>0),{fill:SOFT,media:false});
  for(let i=0;i<12;i++){const L=col(i+2);ts.getCell(i+2).value={formula:`SUM(${L}${first}:${L}${last})`};ts.getCell(i+2).font=font({bold:true})}
  ts.getCell(1).font=font({bold:true});const rTS=r;r+=2;
  const sal=put(r,'Saldo del mese',[...Array(12)].map(()=>0),{media:false});
  for(let i=0;i<12;i++){const L=col(i+2);sal.getCell(i+2).value={formula:`${L}8-${L}${rTS}`}}const rS=r;r++;
  const av=put(r,'Avanzo cumulato',[...Array(12)].map(()=>0),{media:false,fill:SOFT});
  for(let i=0;i<12;i++){const L=col(i+2);av.getCell(i+2).value={formula:i===0?`B${rS}`:`${col(i+1)}${r}+${L}${rS}`};av.getCell(i+2).font=font({bold:true})}
  av.getCell(14).value={formula:`M${r}`};av.getCell(1).font=font({bold:true});r+=2;
  ws.getCell('A'+r).value='Legenda colori: rosso chiaro = categorie fisse · arancio chiaro = variabili · verde = investimenti · azzurro = simulazione';ws.getCell('A'+r).font=font({size:10,italic:true,color:{argb:SUB}});

  // ---------- REGISTRO ----------
  const wr=wb.addWorksheet('Registro',{views:[{state:'frozen',ySplit:1}],properties:{tabColor:{argb:'FFF59E0B'}}});
  const catNome=id=>{const c=cats.find(x=>x.id===id);return c?c.nome:(id||'')};
  const rows=[];
  (D.movimenti||[]).filter(x=>x.anno===anno).forEach(x=>{
    const tipo=x.tipo==='spesa'?'Spesa':x.tipo==='reso'?'Storno / reso':'Entrata spot';
    rows.push({data:x.data?new Date(x.data+'T12:00:00'):null,m:x.mese,mov:x.tipo==='spesa'?'Uscita':'Entrata',tipo,cat:catNome(x.categoria),desc:x.descrizione||'',met:x.metodo||'',u:x.tipo==='spesa'?+x.importo:null,e:x.tipo==='spesa'?null:+x.importo,stato:'Effettivo',quota:x.quota?x.quota+' di '+(+x.totale||0).toLocaleString('it-IT',{minimumFractionDigits:2})+' €':''});
  });
  y.ist.forEach(i=>rows.push({data:dataAddebito(anno,i.m,i.p.giorno||28),m:i.m,mov:'Uscita',tipo:'Prevista ('+(i.p.tipo==='certo'?'certa':'variabile')+')',cat:catNome(i.p.categoria),desc:i.p.descrizione,met:i.p.metodo||'',u:i.importo,e:null,stato:i.stato==='effettivo'?(i.auto?'Pagata (automatica)':'Pagata'):i.stato==='daconfermare'?'Da confermare':'Prevista',quota:''}));
  Object.entries(y.netti).forEach(([mm,n])=>{if(n.stato!=='confermato')return;mm=+mm;const m=mm<=12?mm:mm===13?12:7;rows.push({data:null,m,mov:'Entrata',tipo:'Stipendio',cat:'',desc:'Stipendio '+(mm<=12?MES[mm-1]:mm===13?'13ª':'14ª'),met:'',u:null,e:n.netto,stato:'Effettivo',quota:''})});
  rows.sort((a,b)=>a.m-b.m||((a.data?a.data.getTime():9e15)-(b.data?b.data.getTime():9e15)));
  wr.columns=[{header:'Data',key:'data',width:12},{header:'Mese addebito',key:'mese',width:14},{header:'Movimento',key:'mov',width:11},{header:'Tipo',key:'tipo',width:20},{header:'Categoria',key:'cat',width:24},{header:'Descrizione',key:'desc',width:38},{header:'Metodo',key:'met',width:15},{header:'Uscita',key:'u',width:13},{header:'Entrata',key:'e',width:13},{header:'Stato',key:'stato',width:19},{header:'Ripartizione',key:'quota',width:20}];
  head(wr.getRow(1));
  rows.forEach((x,i)=>{const row=wr.addRow({data:x.data,mese:MES[x.m-1],mov:x.mov,tipo:x.tipo,cat:x.cat,desc:x.desc,met:x.met,u:x.u,e:x.e,stato:x.stato,quota:x.quota});
    row.getCell(1).numFmt='dd/mm/yyyy';row.getCell(8).numFmt=EUR;row.getCell(9).numFmt=EUR;
    if(x.e!=null)row.getCell(9).font=font({color:{argb:'FF0A7A4E'},bold:true});
    if(x.stato==='Prevista'||x.stato==='Da confermare')row.eachCell({includeEmpty:true},c=>{c.font=font({italic:true,color:{argb:x.stato==='Da confermare'?'FF8A4B08':SUB}})});
    if(i%2)row.eachCell({includeEmpty:true},c=>{if(c.col<=11)c.fill=fill('FFF7F8FA')});
  });
  const n=rows.length+1;
  wr.autoFilter={from:'A1',to:'K'+Math.max(2,n)};
  const tot=wr.getRow(n+1);tot.getCell(6).value='TOTALE (rispetta i filtri)';tot.getCell(8).value={formula:`SUBTOTAL(109,H2:H${n})`};tot.getCell(9).value={formula:`SUBTOTAL(109,I2:I${n})`};
  [6,8,9].forEach(k=>{tot.getCell(k).font=font({bold:true});tot.getCell(k).fill=fill(SOFT)});tot.getCell(8).numFmt=EUR;tot.getCell(9).numFmt=EUR;

  // ---------- STIPENDI ----------
  const wt=wb.addWorksheet('Stipendi',{properties:{tabColor:{argb:'FF0A7A4E'}}});
  const np=nettiAnno(D,anno-1);
  wt.columns=[{width:16},{width:13},{width:13},{width:13},{width:13},{width:13},{width:13},{width:13}];
  wt.mergeCells('A1:H1');wt.getCell('A1').value='Stipendi '+anno+' (confronto con '+(anno-1)+')';wt.getCell('A1').font=font({size:16,bold:true});
  const h=wt.getRow(3);h.values=['Mese','Netto '+anno,'Lordo '+anno,'Stato','Netto '+(anno-1),'Lordo '+(anno-1),'Δ netto','Δ lordo'];head(h,'FF0A7A4E');
  for(let m=1;m<=14;m++){const rr=3+m;const a=y.netti[m],p=np[m];const row=wt.getRow(rr);
    row.values=[m<=12?MES[m-1]:m===13?'13ª (Dicembre)':'14ª (Luglio)',a?a.netto:null,a&&a.lordo!=null?a.lordo:null,a?(a.stato==='confermato'?'Confermato':'Simulato'):'',p?p.netto:null,p&&p.lordo!=null?p.lordo:null];
    row.getCell(7).value={formula:`IF(AND(ISNUMBER(B${rr}),ISNUMBER(E${rr})),B${rr}-E${rr},"")`};row.getCell(8).value={formula:`IF(AND(ISNUMBER(C${rr}),ISNUMBER(F${rr})),C${rr}-F${rr},"")`};
    [2,3,5,6,7,8].forEach(k=>row.getCell(k).numFmt=EUR);
    if(a&&a.stato!=='confermato')[2,3,4].forEach(k=>row.getCell(k).font=font({italic:true,color:{argb:SUB}}));
    else if(a)row.getCell(4).font=font({color:{argb:'FF0A7A4E'},bold:true});
    row.eachCell({includeEmpty:true},c=>{if(c.col<=8)c.border={bottom:thin}});
  }
  const R=wt.getRow(18);R.values=['TOTALE'];['B','C','E','F','G','H'].forEach((L,i)=>{const c=R.getCell([2,3,5,6,7,8][i]);c.value={formula:`SUM(${L}4:${L}17)`};c.numFmt=EUR;c.font=font({bold:true});c.fill=fill(SOFT)});R.getCell(1).font=font({bold:true});R.getCell(1).fill=fill(SOFT);
  const M=wt.getRow(19);M.values=['Stipendio standard'];[['B',2],['C',3],['E',5],['F',6]].forEach(([L,k])=>{const c=M.getCell(k);c.value={formula:`${L}18/12`};c.numFmt=EUR;c.font=font({bold:true})});M.getCell(1).font=font({bold:true});
  const T=wt.getRow(20);T.values=['Tasse e contributi'];T.getCell(3).value={formula:'C18-B18'};T.getCell(3).numFmt=EUR;T.getCell(6).value={formula:'F18-E18'};T.getCell(6).numFmt=EUR;
  const P=wt.getRow(21);P.values=['Incidenza su lordo'];P.getCell(3).value={formula:'IF(C18>0,C20/C18,"")'};P.getCell(3).numFmt='0.0%';P.getCell(6).value={formula:'IF(F18>0,F20/F18,"")'};P.getCell(6).numFmt='0.0%';
  wt.getCell('A23').value='Stipendio standard = (12 netti + 13ª + 14ª) / 12. "Simulato" = netto preso dall\'anno precedente finché non arriva quello vero.';wt.getCell('A23').font=font({size:10,italic:true,color:{argb:SUB}});
  [ws,wr,wt].forEach(w=>{w.pageSetup={orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.4,right:.4,top:.5,bottom:.5,header:.2,footer:.2}}});
  return wb;
}

// ---------- utilità ----------
const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const MB=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const NF=new Intl.NumberFormat('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=v=>(v<0?'−':'')+NF.format(Math.abs(v))+' €';
const sgn=v=>(v>0?'+':v<0?'−':'')+NF.format(Math.abs(v))+' €';
const n2=v=>(v<0?'−':'')+NF.format(Math.abs(v));
const inp=v=>v==null||v===''?'':NF.format(+v).replace(/\./g,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=s=>{if(s==null)return NaN;const t=String(s).trim().replace(/\s|€/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');return t===''?NaN:Number(t)};
const pad=n=>String(n).padStart(2,'0');
const today=()=>new Date();
const isoToday=()=>{const d=today();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtDate=d=>{if(!d)return '';const [y,m,g]=d.split('-');return +g+' '+MB[+m-1]+(+y!==S.anno?' '+y:'')};
const nomeStip=m=>m<=12?MESI[m-1]:m===13?'13ª':'14ª';
const meseStip=m=>m<=12?m:m===13?12:7;
const ICON={
  prev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  next:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  moon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',

function catsAnno(anno=S.anno){return cats().filter(c=>catAttiva(c,anno)||catHaDati(c.id,anno))}

function statoChip(s){return s==='effettivo'?'<span class="chip ok">PAGATA</span>':s==='daconfermare'?'<span class="chip warn">DA CONFERMARE</span>':'<span class="chip sim">PREVISTA</span>'}

function anelloCard(y,m,mi){
  const st=m.stato,used=m.disp>0?m.spese/m.disp:(m.spese>0?1:0),pct=Math.max(0,Math.min(1,used));
  const C=2*Math.PI*84;const over=m.saldo<0;let lbl,rate;
  if(st==='corrente'){const t=today();const dim=new Date(S.anno,S.mese,0).getDate();const left=dim-t.getDate()+1;lbl=over?'Sei oltre di':'Ti restano';rate=over?'Spese sopra la disponibilità':`${eur(m.saldo/left)} al giorno · ${left} ${left===1?'giorno':'giorni'}`}
  else if(st==='chiuso'){lbl='Saldo del mese';rate='Mese chiuso'}else{lbl='Saldo previsto';rate='Previsione'}
  return `<section class="card ring-card" aria-label="Il mese"><div class="ring-wrap"><svg viewBox="0 0 208 208" role="img" aria-label="Usato il ${Math.round(used*100)}% della disponibilità"><circle cx="104" cy="104" r="84" fill="none" stroke="var(--soft)" stroke-width="18"/><circle cx="104" cy="104" r="84" fill="none" stroke="${over?'var(--neg)':'var(--accent)'}" stroke-width="18" stroke-linecap="round" stroke-dasharray="${(pct*C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 104 104)"/></svg><div class="ring-center"><span class="lbl">${lbl}</span><span class="big num ${over?'neg':''}">${eur(Math.abs(m.saldo))}</span></div></div><p class="rate-line">${rate}</p><p class="note" style="text-align:center">Spese <strong class="num" style="color:var(--ink)">${eur(m.spese)}</strong> su <strong class="num" style="color:var(--ink)">${eur(m.disp)}</strong> disponibili</p></section>`;
}

  ]:[

    {l:'Spese anno',v:eur(y.mesi.reduce((a,x)=>a+x.spese,0)),n:'Effettive + previste'},
    {l:'Avanzo a oggi',v:lastClosed?sgn(lastClosed.avanzo):'—',n:lastClosed?`Gen – ${MB[lastClosed.m-1]}`:'Nessun mese chiuso',c:lastClosed&&lastClosed.avanzo<0?'neg':'pos'},

// ---------- DASHBOARD ----------
const n0=v=>(v>0?'+':v<0?'−':'')+Math.round(Math.abs(v)).toLocaleString('it-IT');
function saldiChart(y){
  const W=344,H=196,top=22,bot=40,pl=4,step=(W-pl*2)/12,bw=Math.min(20,step-6);
  const vals=y.mesi.map(m=>m.saldo);const mx=Math.max(1,...vals),mn=Math.min(0,...vals);const span=mx-mn||1;
  const Yv=v=>top+(mx-v)/span*(H-top-bot);const z=Yv(0);
  const g=y.mesi.map((m,i)=>{const v=m.saldo,x=pl+i*step+(step-bw)/2,yy=Math.min(Yv(v),z),h=Math.max(1.5,Math.abs(Yv(v)-z));const fut=m.stato==='futuro',sel=i===S.mese-1;
    const col=v>=0?'var(--pos)':'var(--neg)';const ty=v>=0?yy-5:yy+h+11;
    return `<g data-act="setmese" data-k="${i+1}" style="cursor:pointer"><rect x="${(pl+i*step).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${H}" fill="transparent"/>${sel?`<rect x="${(pl+i*step+1).toFixed(1)}" y="2" width="${(step-2).toFixed(1)}" height="${H-4}" rx="8" fill="var(--soft)"/>`:''}<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="4" fill="${col}" opacity="${fut?.4:1}"/><text x="${(x+bw/2).toFixed(1)}" y="${ty.toFixed(1)}" font-size="9" font-weight="700" fill="${col}" text-anchor="middle">${n0(v)}</text><text x="${(x+bw/2).toFixed(1)}" y="${H-8}" font-size="10" font-weight="${sel?800:500}" fill="${sel?'var(--ink)':'var(--sub)'}" text-anchor="middle">${MB[i].charAt(0)}</text></g>`}).join('');
  const chiusi=y.mesi.filter(m=>m.stato!=='futuro');const best=chiusi.length?chiusi.reduce((a,b)=>b.saldo>a.saldo?b:a):null,worst=chiusi.length?chiusi.reduce((a,b)=>b.saldo<a.saldo?b:a):null;
  const pos=y.mesi.filter(m=>m.saldo>=0).length;
  return `<section class="card" aria-label="Saldo mese per mese"><div class="row-head"><h2>Saldo mese per mese</h2><span class="small muted">${pos} sopra, ${12-pos} sotto lo zero</span></div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Saldo di ogni mese: barre verdi sopra lo zero, arancioni sotto; tocca un mese per aprirlo"><line x1="0" x2="${W}" y1="${z.toFixed(1)}" y2="${z.toFixed(1)}" stroke="var(--line)" stroke-width="1.5"/>${g}</svg><div class="legend"><span>${best?`Migliore <strong class="pos">${MB[best.m-1]} ${n0(best.saldo)}</strong>`:''}</span><span>${worst?`Peggiore <strong class="neg">${MB[worst.m-1]} ${n0(worst.saldo)}</strong>`:''}</span></div><p class="note">Barre chiare: mesi futuri (previsione). Tocca un mese per aprirlo.</p></section>`;
}
function prossimeScadenze(){
  const t=today(),t0=new Date(t.getFullYear(),t.getMonth(),t.getDate()),lim=new Date(t0.getTime()+31*864e5);
  const out=[];[t.getFullYear(),t.getFullYear()+1].forEach(a=>istanze(S.D,a,t).forEach(i=>{if(!i.p.scadenza||i.stato==='effettivo'&&!i.auto)return;const d=dataAddebito(a,i.m,i.p.giorno||28);if(d<t0&&(i.stato!=='daconfermare'||t0-d>31*864e5))return;if(d>lim)return;out.push({i,d,a})}));
  return out.sort((a,b)=>a.d-b.d);
}
function vDashboard(){
  if(!cats().length)return header('Dashboard')+onboarding();
  const y=Y(),mi=S.mese-1,m=y.mesi[mi];
  const nDc=y.ist.filter(i=>i.stato==='daconfermare').length;
  const banner=nDc?`<button class="banner" data-act="godaconf"><span><strong>${nDc} ${nDc===1?'voce':'voci'} da confermare</strong> · importo vero ancora da inserire</span>${ICON.chev}</button>`:'';
  // proiezione di fine mese (mese in corso)
  let proj='';
  if(m.stato==='corrente'){const t=today(),dim=new Date(S.anno,S.mese,0).getDate(),g=t.getDate(),left=dim-g+1;
    const varIds=new Set(cats().filter(c=>c.tipo!=='fissa').map(c=>c.id));
    const varReale=r2(S.D.movimenti.filter(x=>x.anno===S.anno&&x.mese===S.mese&&varIds.has(x.categoria)).reduce((a,x)=>a+(x.tipo==='reso'?-1:x.tipo==='spesa'?1:0)*(+x.importo),0));
    const ritmoG=g>0?varReale/g:0,stimaVar=r2(ritmoG*dim);
    const extra=Math.max(0,r2(stimaVar-m.variabili));const fine=r2(m.saldo-extra);
    proj=`<section class="card" aria-label="Fine mese"><div class="row-head"><h2>Come chiudi ${MESI[mi]}</h2><span class="small muted">giorno ${g} di ${dim}</span></div>
     <div class="tiles"><div class="tile ${fine<0?'':'hero'}" style="${fine<0?'background:var(--warn-bg);color:var(--warn-ink)':''}"><span class="t-l">Se continui così</span><span class="t-v num">${sgn(fine)}</span><span class="t-n">saldo a fine mese</span></div><div class="tile"><span class="t-l">Puoi spendere</span><span class="t-v num">${m.saldo>0?eur(r2(m.saldo/left)):'0,00 €'}</span><span class="t-n">al giorno per ${left} giorni</span></div></div>
     <p class="note">Spese variabili finora ${eur(varReale)}, cioè ${eur(r2(ritmoG))} al giorno: a questo ritmo arrivi a circa ${eur(stimaVar)} entro fine mese${extra>0?`, ${eur(extra)} oltre il previsto`:', dentro il previsto'}.</p></section>`}
  // prossime scadenze
  const ps=prossimeScadenze();const t0=today();t0.setHours(0,0,0,0);
  const fra=d=>{const n=Math.round((d-t0)/864e5);return n<0?`scaduta da ${-n} ${-n===1?'giorno':'giorni'}`:n===0?'oggi':n===1?'domani':`tra ${n} giorni`};
  const psTot=r2(ps.reduce((a,x)=>a+x.i.importo,0));
  const scad=`<section class="card tight" aria-label="Prossime scadenze"><div class="row-head" style="padding-top:12px"><h2>Prossime scadenze</h2><a class="link" href="#previsioni" style="text-decoration:none;display:inline-flex;align-items:center">Gestisci</a></div><div class="list">${ps.slice(0,S.dueAll?99:5).map(x=>`<button class="item" data-act="editist" data-id="${esc(x.i.p.id)}" data-k="${x.i.m}"><span class="badge">${x.d.getDate()}<br>${MB[x.d.getMonth()]}</span><span class="grow"><span class="t">${esc(x.i.p.descrizione)}</span><span class="s">${fra(x.d)}${x.i.p.metodo?' · '+esc(x.i.p.metodo):''} ${x.i.stato==='daconfermare'?statoChip('daconfermare'):''}</span></span><span class="amt">−${eur(x.i.importo)}</span></button>`).join('')||'<p class="empty">Nessuna scadenza nei prossimi 30 giorni. Segna come "scadenza" rate, bollette e assicurazioni nelle previsioni.</p>'}</div>${ps.length?`<p class="note" style="padding-bottom:12px">${ps.length} nei prossimi 30 giorni · totale ${eur(psTot)}${ps.length>5?` · <button class="link" data-act="dueall" style="padding:0;min-height:0">${S.dueAll?'mostra meno':'mostra tutte'}</button>`:''}</p>`:''}</section>`;
  // dove vanno i soldi
  const list=y.cat.map(c=>({c,v:c.mesi[mi],a:media(c,S.anno)})).filter(x=>x.v>0.004).sort((a,b)=>b.v-a.v);
  const shown=S.catAll?list:list.slice(0,5);

  const cr=(l,ref)=>{if(ref==null||!(ref>0))return `<span>${l}</span><span class="muted">—</span><span></span>`;const d=r2(m.spese-ref),p=Math.round(d/ref*100);return `<span>${l}</span><span class="num muted">${eur(ref)}</span><strong class="num ${d>0?'neg':'pos'}">${d>0?'+':''}${p}%</strong>`};
  const conf=`<section class="card" aria-label="Confronti"><h2>Spese di ${MESI[mi]} a confronto</h2><div class="cmp"><span class="h">Rispetto a</span><span class="h">Spese</span><span class="h">Diff.</span>${cr('Mese prima',prevM.spese)}${cr(MESI[mi]+' '+(S.anno-1),sameLY.spese)}${cr('Media mesi chiusi',medS)}</div></section>`;

  else nextCard=`<section class="card"><div class="row-head"><div><p class="eyebrow">Previsionale ${nx}</p><p class="note">Copia previsioni e netti del ${S.anno} come simulazione.</p></div><button class="pill-btn soft" data-act="creaanno" data-k="${nx}">Crea</button></div></section>`;
  return header('Dashboard',{badge:false})+banner+saldiChart(y)+proj+scad+dove+conf+avanzoChart(y)+nextCard;
}
// dettaglio di una categoria

  ${prv.length?`<p class="sec-title">Previsioni</p><section class="card tight"><div class="list">${prv.map(p=>`<button class="item" data-act="editprev" data-id="${esc(p.id)}"><span class="grow"><span class="t">${esc(p.descrizione)}</span><span class="s">${TIPI[p.tipo]} · ${mesiLabel(p.importi)}</span></span>${ICON.chev}</button>`).join('')}</div></section>`:''}`;

function splitBar(m){const fp=m.spese>0?Math.max(0,Math.min(1,m.fisse/m.spese)):0;return `<div class="split" aria-hidden="true"><span style="width:${(fp*100).toFixed(1)}%;background:var(--fixed)"></span><span style="flex:1;background:var(--var)"></span></div><div class="legend"><span><span class="dot" style="background:var(--fixed)"></span><strong>Fisse</strong> <span class="muted num">${eur(m.fisse)} · ${Math.round(fp*100)}%</span></span><span><span class="dot" style="background:var(--var)"></span><strong>Variabili</strong> <span class="muted num">${eur(m.variabili)} · ${Math.round((1-fp)*100)}%</span></span></div>`}
function initials(s){return String(s).split(/[\s/+]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
function istRow(i){const g=i.p.giorno;return `<button class="item ${i.stato==='effettivo'?'':'is-prev'}" data-act="editist" data-id="${esc(i.p.id)}" data-k="${i.m}"><span class="badge">${g?esc(g):esc(initials(catName(i.p.categoria)))}</span><span class="grow"><span class="t">${esc(i.p.descrizione)}</span><span class="s">${esc(catName(i.p.categoria))}${g?' · giorno '+esc(g):''}${i.p.metodo?' · '+esc(i.p.metodo):''} ${statoChip(i.stato)}</span></span><span class="amt">−${eur(i.importo)}</span></button>`}
function avanzoChart(y){
  const W=320,H=150,pl=8,pr=8,pt=18,pb=26;

  const area=real.length>1?`M${real[0][0].toFixed(1)},${Yv(0).toFixed(1)} L${line(real).replace(/ /g,' L')} L${real[real.length-1][0].toFixed(1)},${Yv(0).toFixed(1)} Z`:'';

}

// ---------- REGISTRO ----------
function righeMese(anno,m){
  const y=Y(anno);const rows=[];
  S.D.movimenti.filter(x=>x.anno===anno&&x.mese===m).forEach(x=>rows.push({k:'mov',x,data:x.data||'',entrata:x.tipo!=='spesa',importo:+x.importo,cat:x.categoria||null,met:x.metodo||'',stato:'effettivo'}));
  y.ist.filter(i=>i.m===m).forEach(i=>rows.push({k:'ist',i,data:anno+'-'+pad(m)+'-'+pad(i.p.giorno||28),entrata:false,importo:i.importo,cat:i.p.categoria,met:i.p.metodo||'',stato:i.stato}));
  Object.entries(y.netti).forEach(([mm,n])=>{if(meseStip(+mm)===m)rows.push({k:'stip',mm:+mm,n,data:anno+'-'+pad(m)+'-27',entrata:true,importo:n.netto,cat:null,stato:n.stato==='confermato'?'effettivo':'previsto'})});
  return rows;
}
function vRegistro(){
  if(!cats().length)return header('Registro')+onboarding();
  let rows=righeMese(S.anno,S.mese);
  const F=S.regF;
  rows=rows.filter(r=>F==='tutti'||(F==='uscite'&&!r.entrata)||(F==='entrate'&&r.entrata)||(F==='previsti'&&r.stato==='previsto')||(F==='daconf'&&r.stato==='daconfermare'));
  if(S.regCat!=='tutte')rows=rows.filter(r=>r.cat===S.regCat);
  if(S.regMet!=='tutti')rows=rows.filter(r=>r.met===S.regMet);
  rows.sort((a,b)=>(a.stato==='effettivo'?0:1)-(b.stato==='effettivo'?0:1)||b.data.localeCompare(a.data));
  const all=righeMese(S.anno,S.mese);
  const usc=r2(all.filter(r=>!r.entrata&&r.stato==='effettivo').reduce((a,r)=>a+r.importo,0));
  const ent=r2(all.filter(r=>r.entrata).reduce((a,r)=>a+r.importo,0));const entSim=all.some(r=>r.k==='stip'&&r.stato!=='effettivo');
  const pre=r2(all.filter(r=>r.stato!=='effettivo'&&r.k!=='stip').reduce((a,r)=>a+r.importo,0));
  const nDc=all.filter(r=>r.stato==='daconfermare').length;
  const fl=[['tutti','Tutti'],['uscite','Uscite'],['entrate','Entrate'],['previsti','Previsti'],['daconf','Da confermare'+(nDc?` (${nDc})`:'')]];
  const chips=`<div class="chips" role="group" aria-label="Filtro">${fl.map(([k,l])=>`<button data-act="regf" data-k="${k}" aria-pressed="${F===k}">${l}</button>`).join('')}</div><div class="two"><div class="field"><label for="reg-cat" class="sr">Categoria</label><select id="reg-cat" data-change="regcat"><option value="tutte">Tutte le categorie</option>${catsAnno().map(c=>`<option value="${esc(c.id)}" ${S.regCat===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></div><div class="field"><label for="reg-met" class="sr">Metodo di pagamento</label><select id="reg-met" data-change="regmet"><option value="tutti">Tutti i metodi</option>${metodi().map(m=>`<option value="${esc(m)}" ${S.regMet===m?'selected':''}>${esc(m)}</option>`).join('')}</select></div></div>`;
  const bud=S.D.previsioni.filter(p=>p.anno===S.anno&&p.tipo==='budget'&&p.importi&&p.importi[S.mese-1]!=null&&(S.regCat==='tutte'||p.categoria===S.regCat));
  const yc=Y();
  const budRows=bud.map(p=>{const c=yc.cat.find(x=>x.id===p.categoria);const usato=c?c.reale[S.mese-1]:0;const b=+p.importi[S.mese-1];const pc=Math.min(100,b?usato/b*100:0);return `<button class="item" data-act="editprev" data-id="${esc(p.id)}"><span class="grow"><span class="t">${esc(p.descrizione)} · budget</span><span class="s num">Usati ${eur(usato)} su ${eur(b)}</span><span class="bar" style="margin-top:4px"><i style="width:${pc.toFixed(1)}%;background:${usato>b?'var(--neg)':'var(--accent)'}"></i></span></span><span class="amt">${eur(Math.max(0,r2(b-usato)))}<span class="s" style="display:block;font-weight:500">restano</span></span></button>`}).join('');
  const rowHtml=r=>{
    if(r.k==='ist')return istRow(r.i);
    if(r.k==='stip'){const sim=r.n.stato!=='confermato';return `<button class="item ${sim?'is-prev':''}" data-act="editstip" data-k="${r.mm}"><span class="badge in">€</span><span class="grow"><span class="t">Stipendio ${nomeStip(r.mm)}</span><span class="s">Entrata · ${sim?'stima dall\'anno prima <span class="chip sim">SIMULATO</span>':'netto confermato'}</span></span><span class="amt pos">+${eur(r.importo)}</span></button>`}
    const x=r.x;const tl=x.tipo==='spot'?'Entrata spot':x.tipo==='reso'?'Storno / reso · '+esc(catName(x.categoria)):esc(catName(x.categoria));
    return `<button class="item" data-act="editmov" data-id="${esc(x.id)}"><span class="badge ${r.entrata?'in':''}">${r.entrata?'+':esc(initials(catName(x.categoria)))}</span><span class="grow"><span class="t">${esc(x.descrizione||catName(x.categoria))}</span><span class="s">${tl}${x.data?' · '+fmtDate(x.data):''}${x.metodo?' · '+esc(x.metodo):''}${x.quota?' · quota '+esc(x.quota):''}</span></span><span class="amt ${r.entrata?'pos':''}">${r.entrata?'+':'−'}${eur(r.importo)}${x.gruppo?`<span class="s" style="display:block;font-weight:500">di ${eur(+x.totale||0)}</span>`:''}</span></button>`};
  return header('Registro')+chips+`<a class="banner" href="#previsioni" style="background:var(--chip);color:var(--accent-ink);text-decoration:none"><span><strong>Spese previste e ricorrenti</strong> · affitto, rate, abbonamenti, budget</span>${ICON.chev}</a><div class="sum-line"><span>Uscite <strong class="num">${eur(usc)}</strong></span><span>Entrate <strong class="num pos">${eur(ent)}</strong>${entSim?'<span class="simtag">(Simulate)</span>':''}</span><span class="muted">Ancora previste <strong class="num">${eur(pre)}</strong></span></div>`+
   (budRows&&(F==='tutti'||F==='uscite')?`<p class="sec-title">Budget del mese</p><section class="card tight"><div class="list">${budRows}</div></section>`:'')+
   `<p class="sec-title">Movimenti</p><section class="card tight"><div class="list">${rows.map(rowHtml).join('')||'<p class="empty">Nessun movimento con questo filtro.</p>'}</div></section>`;
}

// ---------- ENTRATE ----------
function vEntrate(){

  const rows=[];
  for(let m=1;m<=14;m++){const n=y.netti[m],p=np[m];if(!n&&!p)continue;
    const dn=n&&p?r2(n.netto-p.netto):null,dl=n&&p&&n.lordo!=null&&p.lordo!=null?r2(n.lordo-p.lordo):null;
    rows.push(`<tr class="click" data-act="editstip" data-k="${m}"><td>${nomeStip(m)}</td><td><strong>${n?n2(n.netto):'–'}</strong></td><td>${n&&n.lordo!=null?n2(n.lordo):'–'}</td><td class="${dn<0?'neg':dn>0?'pos':''}">${dn==null?'–':(dn>0?'+':'')+n2(dn)}</td><td class="${dl<0?'neg':dl>0?'pos':''}">${dl==null?'–':(dl>0?'+':'')+n2(dl)}</td><td>${n?`<span class="chip ${n.stato==='confermato'?'ok':'sim'}">${n.stato==='confermato'?'OK':'SIM'}</span>`:''}</td></tr>`)}
  const tl=r2(Object.values(y.netti).reduce((a,n)=>a+(+n.lordo||0),0));
  const pt=r2(Object.values(np).reduce((a,n)=>a+(+n.netto||0),0));
  const mv=S.D.movimenti.filter(x=>x.anno===S.anno);
  const spot=mv.filter(x=>x.tipo==='spot').sort((a,b)=>a.mese-b.mese||(a.data||'').localeCompare(b.data||''));
  const resi=mv.filter(x=>x.tipo==='reso').sort((a,b)=>a.mese-b.mese);
  const rip=+((cfg().riporti||{})[S.anno]||0);
  const li=x=>`<button class="item" data-act="editmov" data-id="${esc(x.id)}"><span class="badge in">${MB[x.mese-1]}</span><span class="grow"><span class="t">${esc(x.descrizione)}</span><span class="s">${x.tipo==='reso'?esc(catName(x.categoria))+' · ':''}${fmtDate(x.data)}</span></span><span class="amt pos">+${eur(+x.importo)}</span></button>`;
  return header('Entrate',{month:false,h:'Prospetto Entrate'})+
   `<div class="actions"><button class="pill-btn" data-act="add" data-k="stipendio">+ Stipendio</button><button class="pill-btn soft" data-act="add" data-k="spot">+ Entrata spot</button></div>`+
   `<section class="card"><div class="tiles"><div class="tile hero"><span class="t-l">Stipendio standard</span><span class="t-v num">${eur(y.std)}</span><span class="t-n">(12 netti + 13ª + 14ª) / 12</span></div><div class="tile"><span class="t-l">Netti anno</span><span class="t-v num">${eur(y.totNetti)}</span><span class="t-n num">${pt?'a.p. '+sgn(r2(y.totNetti-pt)):(tl?'Lordo '+eur(tl):'')}</span></div></div><p class="note">I mesi senza netto registrato usano quello dell'anno prima, come simulazione (SIM). Quando registri lo stipendio diventa confermato (OK) e lo standard si ricalcola.</p></section>`+
   (rows.length?`<div class="table-box"><table><thead><tr><th>Mese</th><th>Netto</th><th>Lordo</th><th>Δ netto a.p.</th><th>Δ lordo a.p.</th><th>Stato</th></tr></thead><tbody>${rows.join('')}<tr class="tot"><td>Totale</td><td>${n2(y.totNetti)}</td><td>${tl?n2(tl):'–'}</td><td>${pt?n2(r2(y.totNetti-pt)):'–'}</td><td></td><td></td></tr></tbody></table></div>`:'<p class="empty">Nessuno stipendio registrato per il '+S.anno+' né per l\'anno prima.</p>')+
   `<p class="sec-title">Entrate spot</p><section class="card tight"><div class="list"><button class="item" data-act="editriporto"><span class="badge in">A.P.</span><span class="grow"><span class="t">Riporto dall'anno precedente</span><span class="s">Conta solo a Gennaio</span></span><span class="amt ${rip<0?'neg':''}">${eur(rip)}</span></button>${spot.map(li).join('')}</div></section>`+
   `<p class="sec-title">Storni e resi</p><section class="card tight"><div class="list">${resi.map(li).join('')||'<p class="empty">Nessuno storno o reso. Riducono la spesa della loro categoria.</p>'}</div></section>`;
}

function simData(){

  const ov=Object.entries(S.sim.netti).map(([m,v])=>({anno:S.anno,mese:+m,netto:v,lordo:null,stato:'simulato'}));
  D.stipendi=S.D.stipendi.filter(s=>!(s.anno===S.anno&&S.sim.netti[s.mese]!=null)).concat(ov);
  return D;
}

let sheetClose=null;
function openSheet(title,html,mount,opts={}){

  bd.innerHTML=`<div class="sheet ${opts.compact?'compact':'tall'}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="sheet-hd"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Chiudi">${ICON.close}</button></div>${html}</div>`;
  bd.hidden=false;
  const close=()=>{bd.hidden=true;bd.innerHTML='';sheetClose=null};
  sheetClose=close;
  bd.onclick=e=>{if(e.target===bd||e.target.closest('[data-close]'))close()};

  const f=bd.querySelector('[data-autofocus]');if(f)setTimeout(()=>f.focus(),60);
}

let toastT=0;function toast(t){const el=document.getElementById('toast');const warn=/non riuscit|non valid|^Scrivi|^Non |^Inserisci|^Hai |^Mancano|^Crea prima|^Serve|deve venire|già in corso|^Ogni mese/i.test(t);
  el.className='toast'+(warn?' warn':'');el.innerHTML=`<span class="t-ic" aria-hidden="true">${warn?'!':'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'}</span><span class="t-tx"></span>`;el.querySelector('.t-tx').textContent=t;
  el.hidden=false;el.classList.remove('in');void el.offsetWidth;el.classList.add('in');el.onclick=()=>{el.classList.remove('in');setTimeout(()=>el.hidden=true,250)};
  clearTimeout(toastT);toastT=setTimeout(()=>{el.classList.remove('in');setTimeout(()=>el.hidden=true,250)},3200)}
function catOptions(sel){return cats().filter(c=>catAttiva(c,S.anno)||c.id===sel||catHaDati(c.id,S.anno)).map(c=>`<option value="${esc(c.id)}" ${c.id===sel?'selected':''}>${esc(c.nome)}</option>`).join('')}
function meseOptions(sel){return MESI.map((n,i)=>`<option value="${i+1}" ${i+1===sel?'selected':''}>${n}</option>`).join('')}
function stipOptions(sel){return [...Array(14).keys()].map(i=>`<option value="${i+1}" ${i+1===sel?'selected':''}>${nomeStip(i+1)}</option>`).join('')}
function topCats(){const lim=Date.now()-120*864e5;const cnt={};S.D.movimenti.forEach(x=>{if(x.tipo==='spesa'&&x.categoria){const d=x.data?Date.parse(x.data):0;cnt[x.categoria]=(cnt[x.categoria]||0)+(d>=lim?3:1)}});
  const att=cats().filter(c=>catAttiva(c,S.anno)&&c.tipo!=='investimento'&&c.tipo!=='simulazione');
  const bud=new Set(S.D.previsioni.filter(p=>p.anno===S.anno&&p.tipo==='budget').map(p=>p.categoria));
  const used=att.filter(c=>cnt[c.id]).sort((a,b)=>cnt[b.id]-cnt[a.id]);
  const rest=att.filter(c=>!cnt[c.id]&&(c.tipo==='variabile'||bud.has(c.id)));
  const out=used.concat(rest).slice(0,8);return out.length?out:att.slice(0,8)}
function curM(){return S.anno===today().getFullYear()?today().getMonth()+1:S.mese}
